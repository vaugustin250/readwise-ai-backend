databases:
  - name: readwise-db
    databaseName: readwise
    user: readwise_user
    plan: free

services:
  - type: web
    name: readwise-ai-backend
    runtime: python
    buildCommand: pip install -r backend_api/requirements.txt && alembic -c backend_api/alembic.ini upgrade head
    startCommand: cd backend_api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: PYTHONPATH
        value: .:backend_api
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: readwise-db
          property: connectionString
